server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Gzip sıkıştırma
      gzip on;
      gzip_types text/plain text/css application/javascript application/json image/svg+xml;

      # Statik assetler için cache
      location /_next/static/ {
          expires 1y;
          add_header Cache-Control "public, immutable";
      }

      location /assets/ {
          expires 30d;
          add_header Cache-Control "public";
      }

      # Sayfalar için SPA routing
      location /hakkimizda {
          try_files $uri $uri/index.html /hakkimizda/index.html;
      }

      location /nasil-calisir {
          try_files $uri $uri/index.html /nasil-calisir/index.html;
      }

      location /iletisim {
          try_files $uri $uri/index.html /iletisim/index.html;
      }

      location /blog {
          try_files $uri $uri/index.html /blog/index.html;
      }

      location /cozumler {
          try_files $uri $uri/index.html /cozumler/index.html;
      }

      location / {
          try_files $uri $uri/ /index.html;
      }

      # Güvenlik başlıkları
      add_header X-Frame-Options "SAMEORIGIN";
      add_header X-Content-Type-Options "nosniff";
  }
  