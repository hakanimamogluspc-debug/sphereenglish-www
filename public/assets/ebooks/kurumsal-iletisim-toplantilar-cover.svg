<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#1B365D"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1FB8AC"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="850" fill="url(#bg)"/>

  <!-- Geometric accents -->
  <circle cx="500" cy="120" r="180" fill="url(#accent)" opacity="0.08"/>
  <circle cx="100" cy="750" r="220" fill="url(#accent)" opacity="0.06"/>
  <path d="M 0 600 L 600 480 L 600 600 L 0 720 Z" fill="url(#accent)" opacity="0.04"/>

  <!-- Top brand -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="40" height="3" fill="url(#accent)"/>
    <text x="0" y="32" fill="#F6F4ED" font-family="Inter, Söhne, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3">SPHERE ENGLISH</text>
    <text x="0" y="56" fill="#7dd3fc" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="2">İŞ İNGİLİZCESİNDE 1000 KELİME · KİTAP 01</text>
  </g>

  <!-- Center decorative element -->
  <g transform="translate(300, 340)" opacity="0.9">
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#accent)" stroke-width="0.8" opacity="0.3"/>
    <circle cx="0" cy="0" r="40" fill="url(#accent)" opacity="0.15"/>
    <text x="0" y="8" fill="#F6F4ED" font-family="Inter, sans-serif" font-size="32" font-weight="800" text-anchor="middle">01</text>
  </g>

  <!-- Main title -->
  <g transform="translate(60, 480)">
    <text x="0" y="0" fill="#F6F4ED" font-family="Inter, Söhne, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
      <tspan x="0" dy="0">Kurumsal</tspan>
      <tspan x="0" dy="62">İletişim &amp;</tspan>
      <tspan x="0" dy="62">Toplantılar</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(60, 700)">
    <rect x="0" y="0" width="40" height="2" fill="url(#accent)"/>
    <text x="0" y="24" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13" font-weight="500" opacity="0.85">
      <tspan x="0" dy="0">50 vazgeçilmez kurumsal kalıp</tspan>
      <tspan x="0" dy="18">150 temel iş terimi · ünite alıştırmaları</tspan>
    </text>
  </g>

  <!-- Bottom author + brand -->
  <g transform="translate(60, 790)">
    <text x="0" y="0" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">YAZAR · DİDEM İMAMOĞLU</text>
    <text x="480" y="0" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="1">2026</text>
  </g>
</svg>
